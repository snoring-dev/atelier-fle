services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/data/fle.db
      GOTENBERG_URL: http://pdf:3000
      PUBLIC_INTERNAL_URL: http://web:3000
      MEDIA_DIR: /app/data/media
    volumes:
      - fle-data:/app/data
      - fle-media:/app/data/media
    depends_on:
      - pdf

  pdf:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      # Compose `web` + host Next (`pnpm dev`) via Docker Desktop.
      - --chromium-allow-list=^http://(web|host\.docker\.internal):3000/.*
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"

volumes:
  fle-data:
  fle-media:
